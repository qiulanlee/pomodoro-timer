<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
  /* ========== 深色主题 ========== */
  :root {
    --bg: #1a1a2e;
    --card: #222244;
    --text: #ffffff;
    --muted: #888;
    --ring-w: 14;
    --mode-bar: #222244;
    --mode-hover: #444;
    --reset-bg: #333344;
    --reset-fg: #aaa;
    --reset-hover-bg: #444455;
    --reset-hover-fg: #fff;
    --pause-bg: #444466;
    --pause-hover: #555577;
    --stat-card-bg: #222244;
    --label-paused: #ff9800;
    --label-ready: #666;
    --label-running: #999;
    --shadow: none;
    --inner-bg-start: rgba(255,255,255,.03);
    --inner-bg-end: rgba(0,0,0,0);
    --tick-color: rgba(255,255,255,.04);
  }

  /* ========== 浅色主题 ========== */
  body[data-theme="light"] {
    --bg: #FFF5F0;
    --card: #FFFFFF;
    --text: #2D2D2D;
    --muted: #AAA;
    --mode-bar: #F0F0F0;
    --mode-hover: #E0E0E0;
    --reset-bg: #F0F0F0;
    --reset-fg: #999;
    --reset-hover-bg: #E0E0E0;
    --reset-hover-fg: #666;
    --pause-bg: #E8E8E8;
    --pause-hover: #DDD;
    --stat-card-bg: #FFFFFF;
    --label-paused: #E8890C;
    --label-ready: #CCC;
    --label-running: #AAA;
    --shadow: 0 2px 16px rgba(0,0,0,.05);
    --inner-bg-start: rgba(0,0,0,.02);
    --inner-bg-end: rgba(0,0,0,0);
    --tick-color: rgba(0,0,0,.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    user-select: none; -webkit-user-select: none;
    transition: background .5s, color .5s;
  }
  .app {
    width: 400px; padding: 40px 20px 24px;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }

  /* ---- 主题切换 ---- */
  .theme-toggle {
    position: absolute; top: 4px; right: 4px;
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: var(--card); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    transition: background .5s, transform .2s, box-shadow .3s;
  }
  .theme-toggle:hover { transform: scale(1.12); box-shadow: 0 4px 20px rgba(0,0,0,.1); }
  .theme-toggle:active { transform: scale(.88); }

  /* ---- 模式按钮 ---- */
  .modes {
    display: flex; gap: 6px;
    background: var(--mode-bar); border-radius: 14px; padding: 5px;
    margin-bottom: 32px;
    transition: background .5s;
  }
  .mode-btn {
    padding: 9px 18px; border: none; border-radius: 11px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    color: var(--muted); background: transparent;
    transition: all .25s; white-space: nowrap; font-family: inherit;
    position: relative;
  }
  .mode-btn:hover { color: var(--text); background: var(--mode-hover); }
  .mode-btn.active { color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  body[data-mode="focus"] .mode-btn.active { background: #E85D5D; }
  body[data-mode="shortBreak"] .mode-btn.active { background: #4CAF50; }
  body[data-mode="longBreak"] .mode-btn.active { background: #5C6BC0; }

  /* ---- 圆环容器 ---- */
  .ring-container {
    position: relative; width: 280px; height: 280px;
    margin-bottom: 28px;
    overflow: visible; /* 阴影不裁剪 */
  }
  .ring-container svg { overflow: visible; }
  .ring-container svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: var(--ring-w);
    transition: stroke .5s;
  }
  .ring-fg {
    fill: none;
    stroke: var(--ring-fg);
    stroke-width: var(--ring-w);
    stroke-linecap: round;
    transition: stroke-dashoffset .35s ease, stroke .4s;
    filter: drop-shadow(0 0 10px var(--ring-glow));
  }
  /* 内圈装饰细线 */
  .ring-inner {
    fill: none;
    stroke: var(--tick-color);
    stroke-width: 1;
    transition: stroke .5s;
  }

  /* 内圈径向渐变背景（让中心不空洞） */
  .ring-gradient {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle, var(--inner-bg-start) 0%, var(--inner-bg-end) 70%);
    pointer-events: none;
    transition: background .5s;
  }

  /* 进度端点发光圆点（JS 动态定位） */
  .ring-dot {
    position: absolute; border-radius: 50%;
    background: var(--ring-fg);
    box-shadow: 0 0 14px 3px var(--ring-glow);
    width: 16px; height: 16px;
    transition: background .4s, box-shadow .4s;
    pointer-events: none;
    /* 默认隐藏，JS 控制显示 */
    display: none;
  }

  /* 时间显示 */
  .time-display {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    pointer-events: none;
  }
  .time-num {
    font-size: 52px; font-weight: 900;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    transition: color .3s, transform .4s cubic-bezier(.34,1.56,.64,1);
    line-height: 1;
  }
  .time-num.warning { color: #E85D5D !important; }
  .time-num.pulse {
    animation: numPulse .5s ease-out;
  }
  @keyframes numPulse {
    0% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .time-label {
    font-size: 13px; font-weight: 600;
    margin-top: 6px; letter-spacing: 2px;
    transition: color .3s;
  }
  /* 暂停时标签呼吸 */
  body[data-running="false"] .ring-container[data-paused="true"] .time-label {
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: .7; }
    50% { opacity: 1; }
  }

  /* 完成时圆环脉冲 */
  .ring-container.complete .ring-fg {
    animation: ringFlash .6s ease-out;
  }
  @keyframes ringFlash {
    0% { stroke-width: 22; opacity: .6; }
    100% { stroke-width: var(--ring-w); opacity: 1; }
  }

  /* ---- 控制按钮 ---- */
  .controls {
    display: flex; gap: 16px; margin-bottom: 26px;
    align-items: center;
  }
  .btn {
    padding: 14px 36px; border: none; border-radius: 30px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; font-family: inherit;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: ''; position: absolute; inset: 0; border-radius: 30px;
    background: radial-gradient(circle at center, rgba(255,255,255,.2) 0%, transparent 70%);
    opacity: 0; transition: opacity .3s;
  }
  .btn:hover::after { opacity: 1; }
  .btn-start {
    background: var(--ring-fg); color: #fff;
    box-shadow: 0 6px 24px var(--ring-glow);
    min-width: 140px;
    transition: background .4s, box-shadow .4s, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-start:hover { transform: scale(1.06); }
  .btn-start:active { transform: scale(.94); }
  .btn-pause {
    background: var(--pause-bg); color: var(--text);
    min-width: 140px;
    transition: background .4s, color .4s, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-pause:hover { background: var(--pause-hover); transform: scale(1.04); }
  .btn-pause:active { transform: scale(.94); }
  .btn-reset {
    width: 48px; height: 48px; padding: 0; border-radius: 50%;
    background: var(--reset-bg); color: var(--reset-fg);
    font-size: 18px;
    transition: background .4s, color .4s, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-reset:hover { background: var(--reset-hover-bg); color: var(--reset-hover-fg); transform: scale(1.1) rotate(90deg); }
  .btn-reset:active { transform: scale(.85); }

  /* ---- 统计 ---- */
  .stats { display: flex; gap: 16px; }
  .stat-card {
    background: var(--stat-card-bg); border-radius: 16px;
    width: 98px; padding: 14px 0 12px; text-align: center;
    box-shadow: var(--shadow);
    transition: background .5s, box-shadow .5s, transform .2s;
    cursor: default;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-icon { font-size: 18px; margin-bottom: 2px; }
  .stat-val { font-size: 26px; font-weight: 900; line-height: 1.2; }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
</style>
</head>
<body data-mode="focus" data-theme="dark" data-running="false">

<div class="app">

  <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>

  <!-- 模式切换 -->
  <div class="modes">
    <button class="mode-btn active" data-mode="focus">专注 25</button>
    <button class="mode-btn" data-mode="shortBreak">短休 5</button>
    <button class="mode-btn" data-mode="longBreak">长休 15</button>
  </div>

  <!-- 圆形进度 -->
  <div class="ring-container" id="ringContainer" data-paused="false">
    <div class="ring-gradient"></div>
    <svg viewBox="0 0 260 260">
      <!-- 刻度标记（12 个小点） -->
      <circle class="ring-bg" cx="130" cy="130" r="100"/>
      <circle class="ring-inner" cx="130" cy="130" r="86"/>
      <circle class="ring-fg" cx="130" cy="130" r="100"
              stroke-dasharray="628.32" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-dot" id="ringDot"></div>
    <div class="time-display">
      <div class="time-num" id="time">25:00</div>
      <div class="time-label" id="label">准备开始</div>
    </div>
  </div>

  <!-- 按钮 -->
  <div class="controls">
    <button class="btn btn-start" id="btnToggle">▶  开始</button>
    <button class="btn btn-reset" id="btnReset" style="display:none">↺</button>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">🍅</div>
      <div class="stat-val" id="statToday">0</div>
      <div class="stat-lbl">今日番茄</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-val" id="statTotal">0</div>
      <div class="stat-lbl">总计番茄</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔥</div>
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-lbl">连续天数</div>
    </div>
  </div>

</div>

<script>
// ==================== 常量 ====================
const CIRCUMFERENCE = 2 * Math.PI * 100; // r=100
const DURATIONS = { focus: 25*60, shortBreak: 5*60, longBreak: 15*60 };
const RING_CX = 130, RING_CY = 130, RING_R = 100;
const SVG_SIZE = 260;

const RING = {
  focus: {
    dark:  { bg: '#3a1a1a', fg: '#EF5350', glow: 'rgba(239,83,80,.5)' },
    light: { bg: '#FFE0E0', fg: '#E85D5D', glow: 'rgba(232,93,93,.4)' },
  },
  shortBreak: {
    dark:  { bg: '#1a3a1a', fg: '#66BB6A', glow: 'rgba(102,187,106,.5)' },
    light: { bg: '#D8F0DA', fg: '#4CAF50', glow: 'rgba(76,175,80,.4)' },
  },
  longBreak: {
    dark:  { bg: '#1a2a3a', fg: '#42A5F5', glow: 'rgba(66,165,245,.5)' },
    light: { bg: '#DCE4FA', fg: '#5C6BC0', glow: 'rgba(92,107,192,.4)' },
  },
};

// ==================== DOM ====================
const body = document.body;
const elTime = document.getElementById('time');
const elLabel = document.getElementById('label');
const elBtnToggle = document.getElementById('btnToggle');
const elBtnReset = document.getElementById('btnReset');
const elThemeToggle = document.getElementById('themeToggle');
const elStatToday = document.getElementById('statToday');
const elStatTotal = document.getElementById('statTotal');
const elStatStreak = document.getElementById('statStreak');
const ringContainer = document.getElementById('ringContainer');
const ringFg = document.querySelector('.ring-fg');
const ringDot = document.getElementById('ringDot');
const modeBtns = document.querySelectorAll('.mode-btn');

// ==================== 状态 ====================
let mode = 'focus';
let totalSecs = DURATIONS.focus;
let remaining = totalSecs;
let running = false;
let timerId = null;
let theme = localStorage.getItem('pomodoro_theme') || 'dark';

// ==================== 初始化 ====================
applyTheme();
loadStats();
updateUI();

// ==================== 主题 ====================
elThemeToggle.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('pomodoro_theme', theme);
  applyTheme();
  updateUI();
});

function applyTheme() {
  body.dataset.theme = theme;
  elThemeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  elThemeToggle.title = theme === 'dark' ? '切换浅色' : '切换深色';
}

// ==================== 事件 ====================
modeBtns.forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));
elBtnToggle.addEventListener('click', () => running ? pause() : start());
elBtnReset.addEventListener('click', reset);
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
  if (e.code === 'KeyR') reset();
  if (e.code === 'Digit1') switchMode('focus');
  if (e.code === 'Digit2') switchMode('shortBreak');
  if (e.code === 'Digit3') switchMode('longBreak');
});

// ==================== 核心逻辑 ====================
function switchMode(m) {
  if (running) pause();
  mode = m;
  totalSecs = DURATIONS[mode];
  remaining = totalSecs;
  body.dataset.mode = mode;
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.title = '🍅 番茄钟';
  updateUI();
}

function start() {
  if (running) return;
  running = true;
  body.dataset.running = 'true';
  ringContainer.dataset.paused = 'false';
  elBtnToggle.textContent = '⏸  暂停';
  elBtnToggle.className = 'btn btn-pause';
  elBtnReset.style.display = 'flex';
  elBtnReset.style.alignItems = 'center';
  elBtnReset.style.justifyContent = 'center';
  updateUI();
  tick();
}

function pause() {
  running = false;
  clearTimeout(timerId);
  body.dataset.running = 'false';
  ringContainer.dataset.paused = 'true';
  elBtnToggle.textContent = '▶  开始';
  elBtnToggle.className = 'btn btn-start';
  document.title = '🍅 番茄钟';
  updateUI();
}

function reset() {
  if (running) { running = false; clearTimeout(timerId); }
  remaining = totalSecs;
  body.dataset.running = 'false';
  ringContainer.dataset.paused = 'false';
  elBtnToggle.textContent = '▶  开始';
  elBtnToggle.className = 'btn btn-start';
  elBtnReset.style.display = 'none';
  document.title = '🍅 番茄钟';
  updateUI();
}

function tick() {
  if (!running) return;
  if (remaining <= 0) { complete(); return; }
  remaining--;
  updateUI();
  // 页面标题实时显示倒计时
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.title = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} - 番茄钟`;
  timerId = setTimeout(tick, 1000);
}

function complete() {
  running = false;
  body.dataset.running = 'false';
  ringContainer.dataset.paused = 'false';

  // 完成脉冲动画
  ringContainer.classList.add('complete');
  setTimeout(() => ringContainer.classList.remove('complete'), 600);

  playChime();
  notify();
  document.title = '🍅 番茄钟';

  if (mode === 'focus') { incrementStats(); }
  const next = mode === 'focus' ? 'shortBreak' : 'focus';
  switchMode(next);
}

// ==================== UI 更新 ====================
function updateUI() {
  const ratio = totalSecs > 0 ? remaining / totalSecs : 1;
  const offset = CIRCUMFERENCE * (1 - ratio);
  ringFg.style.strokeDashoffset = offset;

  // 主题色
  const r = RING[mode][theme];
  document.documentElement.style.setProperty('--ring-bg', r.bg);
  document.documentElement.style.setProperty('--ring-fg', r.fg);
  document.documentElement.style.setProperty('--ring-glow', r.glow);

  // 开始按钮
  if (!running) {
    elBtnToggle.style.background = r.fg;
    elBtnToggle.style.boxShadow = `0 6px 24px ${r.glow}`;
  }

  // 时间数字
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  elTime.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  elTime.className = 'time-num' + (running && remaining <= 60 ? ' warning' : '');

  // 进度端点圆点
  updateDot(ratio);

  // 标签
  if (running) {
    const labels = { focus: '专注中...', shortBreak: '休息一下 ☕', longBreak: '好好休息 🌿' };
    elLabel.textContent = labels[mode];
    elLabel.style.color = getComputedStyle(document.documentElement).getPropertyValue('--label-running').trim();
  } else if (remaining !== totalSecs) {
    elLabel.textContent = '已暂停';
    elLabel.style.color = getComputedStyle(document.documentElement).getPropertyValue('--label-paused').trim();
  } else {
    elLabel.textContent = '准备开始';
    elLabel.style.color = getComputedStyle(document.documentElement).getPropertyValue('--label-ready').trim();
  }
}

// ---- 进度端点圆点定位 ----
function updateDot(ratio) {
  if (ratio <= 0.002 || ratio >= 0.998) {
    ringDot.style.display = 'none';
    return;
  }
  ringDot.style.display = 'block';
  // 容器尺寸 280x280，SVG 圆心在容器中心 (140,140)，映射到容器坐标
  const containerW = ringContainer.clientWidth;
  const containerH = ringContainer.clientHeight;
  const scaleX = containerW / SVG_SIZE;
  const scaleY = containerH / SVG_SIZE;
  const cx = containerW / 2;
  const cy = containerH / 2;
  const r = RING_R * ((scaleX + scaleY) / 2); // 平均缩放后的半径

  // 进度从 12 点顺时针：angle = 90 - ratio*360（度）
  const angleDeg = 90 - ratio * 360;
  const rad = angleDeg * Math.PI / 180;
  const dx = r * Math.cos(rad);
  const dy = -r * Math.sin(rad);
  const dotSize = 16;
  ringDot.style.left = `${cx + dx - dotSize/2}px`;
  ringDot.style.top  = `${cy + dy - dotSize/2}px`;
}

// 窗口 resize 时更新圆点位置
window.addEventListener('resize', () => {
  if (!running && remaining === totalSecs) return;
  updateUI();
});

// ==================== 音效 ====================
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.15;
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.start(t); osc.stop(t + 0.45);
    });
  } catch(e) {}
}

// ==================== 通知 ====================
function notify() {
  const msgs = {
    focus: '🍅 专注时间结束！休息一下吧~',
    shortBreak: '☕ 短休结束，继续加油！',
    longBreak: '🌿 长休结束，准备好了吗？',
  };
  if (Notification.permission === 'granted') {
    new Notification('番茄钟', { body: msgs[mode], silent: false });
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(p => { if (p === 'granted') notify(); });
  }
  document.title = '⏰ ' + msgs[mode];
  setTimeout(() => { document.title = '🍅 番茄钟'; }, 3000);
}

// ==================== 统计 ====================
function loadStats() {
  try {
    const raw = localStorage.getItem('pomodoro_stats');
    if (raw) {
      const d = JSON.parse(raw);
      const today = new Date().toDateString();
      if (d.lastDate !== today) {
        const yesterday = new Date(Date.now()-864e5).toDateString();
        d.streak = d.lastDate === yesterday ? (d.streak||0)+1 : 1;
        d.today = 0; d.lastDate = today;
      }
      elStatToday.textContent = d.today || 0;
      elStatTotal.textContent = d.total || 0;
      elStatStreak.textContent = d.streak || 0;
    }
  } catch(e) {}
}

function incrementStats() {
  try {
    const raw = localStorage.getItem('pomodoro_stats');
    const d = raw ? JSON.parse(raw) : { total:0, today:0, streak:0, lastDate:'' };
    d.total = (d.total||0) + 1;
    d.today = (d.today||0) + 1;
    d.lastDate = new Date().toDateString();
    localStorage.setItem('pomodoro_stats', JSON.stringify(d));
    elStatToday.textContent = d.today;
    elStatTotal.textContent = d.total;
    elStatStreak.textContent = d.streak;
  } catch(e) {}
}

if (Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
